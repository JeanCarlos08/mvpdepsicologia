# Copie este arquivo para `.streamlit/secrets.toml` e PREENCHA seus dados reais.
# NUNCA versione `.streamlit/secrets.toml` com credenciais.

# Opção 1) URL única (recomendado por provedores como Neon, Supabase, Render, ElephantSQL)
# Substitua os placeholders e mantenha sslmode conforme exigido pelo provedor (muitos pedem "require").
# DATABASE_URL = "postgresql://USUARIO:SENHA@HOST:PORTA/NOME_DO_BANCO?sslmode=require"

# Opção 2) Campos separados
# Descomente e preencha TODOS os campos abaixo:
# db_host = "seu-host.public"   # Ex.: ep-abc-xyz-123.aws.neon.tech
# db_port = 5432
# db_name = "seu_banco"
# db_user = "seu_usuario"
# db_password = "sua_senha"
# db_sslmode = "require"         # use "require" se o provedor exigir TLS

# Outras flags do app (opcionais)
# APP_REQUIRE_AUTH = true         # exige login ao abrir o app
# APP_ADMIN_USER = "admin"       # usuário admin de fallback (secrets ausentes)
# APP_ADMIN_PASS = "admin123"    # senha admin de fallback (secrets ausentes)
